# configs/model/ hier_sasrec.yaml
model:
  name: hier_sasrec

  n_heads: 4
  n_layers: 3
  dropout: 0.2

  use_positional_embedding: true
  use_time_embedding: true
  use_causal_mask: true

  # Cấu hình điều phối thông tin phân cấp đa tầng danh mục
  use_time_decay: true
  use_attention_pooling: true
  use_gate: true
