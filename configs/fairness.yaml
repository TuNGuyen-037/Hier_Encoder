# ============================================================
# FAIRNESS PROTOCOL
# Locked settings for fair model comparison
# configs/fairness.yaml
# ============================================================
fairness:
  embedding_dim: 128

  batch_size: 256
  learning_rate: 0.0003

  optimizer: adamw
  weight_decay: 0.0001

  epochs: 1000

  early_stopping_patience: 20
  early_stopping_metric: ndcg@10

  grad_clip: 1.0

  k_core: 5
  max_seq_len: 50

  top_k: [5, 10, 20]
