# ============================================================
# FAIRNESS PROTOCOL
# Locked settings for fair model comparison
# ============================================================

fairness:
  embedding_dim: 128

  batch_size: 256
  learning_rate: 0.0003

  optimizer: adamw
  weight_decay: 0.0001

  epochs: 1000

  early_stopping_patience: 20
  early_stopping_metric: ndcg@10

  grad_clip: 1.0

  eval_top_k: [5, 10, 20]
